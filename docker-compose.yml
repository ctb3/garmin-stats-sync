services:
  sync:
    build: .
    image: garmin-stats-sync:latest
    container_name: garmin-stats-sync
    env_file: .env
    volumes:
      - ./data:/data
    # BIND_ADDR defaults to loopback, which suits a host with a reverse proxy in
    # front. Set it to the host's LAN address (or 0.0.0.0) when the phone has to
    # reach the container directly.
    #
    # Publishing beyond loopback is a real exposure decision: Docker's iptables
    # DOCKER chain DNATs *before* ufw/firewalld, so a host firewall you believe
    # blocks this port will not block it.
    #
    # HOST_PORT is the published port only. The listener inside the container is
    # always 8080 - do not reuse INGEST_PORT here, or changing it to dodge a
    # host conflict would move the listener out from under the mapping.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    # SIGTERM breaks the sync loop out of its wait, so shutdown is prompt and
    # in-flight requests finish rather than being severed.
    stop_grace_period: 15s
    healthcheck:
      # python, not curl: python:3.12-slim has no curl, and a healthcheck that
      # always fails is worse than none.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          with urllib.request.urlopen("http://127.0.0.1:8080/health", timeout=3) as r:
              sys.exit(0 if r.status == 200 else 1)
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: ["loop"]
