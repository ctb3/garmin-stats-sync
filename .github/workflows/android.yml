name: Android APK

# There is no local Android toolchain, by design: the APK is built here and
# sideloaded. Sideloading also means no Play listing, so no Health Connect
# declaration form and no privacy policy.
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # No wrapper is committed (there is no local toolchain to generate one),
      # so pin the Gradle version explicitly here.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Unit tests first: they cover the wire contract with the server and run
      # on a plain JVM, so a mismatch fails here rather than on a phone.
      - name: Unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/

      - uses: actions/upload-artifact@v5
        with:
          name: garmin-sync-debug-apk
          path: android/app/build/outputs/apk/debug/garmin-sync-debug.apk
          if-no-files-found: error
